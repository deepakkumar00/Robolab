name: Deploy Robolab Intel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Write key into a separate config.js file
      # Avoids all sed/escaping issues with special characters in API keys
      - name: Inject API Key
        run: |
          echo "window.GROQ_API_KEY = '${{ secrets.GROQ_API_KEY }}';" > config.js

      - name: Verify config created
        run: |
          echo "config.js bytes: $(wc -c < config.js)"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
